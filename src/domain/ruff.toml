extend = "../../pyproject.toml"

[lint]
select = ["E4", "E7", "E9", "F", "TID"]

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[lint.flake8-tidy-imports.banned-api]
"src.application" = { msg = "Domain code must not depend on the application layer." }
"src.adapters" = { msg = "Domain code must not depend on adapters." }
"fastapi" = { msg = "Domain code must not depend on HTTP frameworks." }
"typer" = { msg = "Domain code must not depend on CLI frameworks." }
"sqlite3" = { msg = "Domain code must not depend on database drivers." }
"psycopg" = { msg = "Domain code must not depend on database drivers." }
